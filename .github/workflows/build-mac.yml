name: Build macOS App

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Python & Tkinter
        run: |
          python3 --version
          if ! python3 -c "import tkinter" 2>/dev/null; then
            echo "Tkinter não encontrado no setup-python, instalando python-tk..."
            brew install python-tk@3.11 || true
          fi
          python3 -c "import tkinter; print('Tkinter validado com sucesso! Versao:', tkinter.TkVersion)"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyinstaller

      - name: Run build script
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Package macOS App Bundle & Binaries
        run: |
          cd dist
          # Empacota MPFolders.app com preservação de symlinks (-y)
          if [ -d "MPFolders.app" ]; then
            zip -r -y MPFolders_macOS_app.zip MPFolders.app
          fi
          # Empacota binários standalone caso gerados
          if [ -f "MPFolders" ]; then
            zip -y MPFolders_macOS_binary.zip MPFolders
          fi

          echo "Arquivos empacotados em dist/:"
          ls -lh *.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MPFolders-macOS-Build
          path: dist/*.zip
          if-no-files-found: error
